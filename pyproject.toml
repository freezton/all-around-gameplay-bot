[project]
name = "all-around-bot"
version = "0.1.0"
description = "All-purpose Discord bot: message archive, voice, and content generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "davey<0.2.0",
    "discord-py[voice]>=2.6",
    "emoji>=2.14",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
all-around-bot = "all_around_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/all_around_bot"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
